<h2 >Episode {{episodeNumber()}} </h2>
@if(resourceEpisode.isLoading()){
  <div class="d-flex justify-content-center align-items-center">
    <div class="spinner-grow text-info" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
}

@if(resourceEpisode.error()){
  <div class="alert alert-danger">Error loading Season Data</div>
}


@if(episode(); as epi){
  <div class="row justify-content-center">
    <div class="col-5">
      <div class="card shadow-sm">
        <img [src]="epi.image">
        <div class="card-header">
          <h5 class="card-title text-primary">{{epi.title}}</h5>
          <p class="text-muted">{{epi.description}}</p>
        </div>
      </div>
    </div>
  </div>
}
